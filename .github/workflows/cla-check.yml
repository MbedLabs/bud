name: CLA Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  cla-check:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    steps:
      - name: Verify CLA Acceptance
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Dependabot and other automated bots are exempt
            if (pr.user.type === 'Bot' || author.includes('[bot]')) {
              core.info(`Author is a bot (${author}); exempt from CLA.`);
              return;
            }

            const body = pr.body || '';
            // Check for [x] or [X] next to CLA declaration
            const claRegex = /\[[xX]\]\s+\*\*I have read and accept `CLA\.md`/i;

            if (claRegex.test(body)) {
              core.info(`✅ CLA verified for ${author} on PR #${pr.number}`);
            } else {
              core.setFailed(
                `❌ Contributor License Agreement (CLA) not accepted! Please edit the PR description and check the box under "Contributor License Agreement".`
              );
            }
