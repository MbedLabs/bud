name: Bud Product CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_bud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
          pip install black==25.1.0 isort==5.13.2 bandit==1.8.3 pip-audit

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Check backend formatting with Black
        run: black --check --diff app/

      - name: Check backend imports with isort
        run: isort --profile black --check-only --diff app/

      - name: Run backend security scans
        run: |
          bandit -r app/ -ll
          pip-audit || true

      - name: Create tables (model-driven base schema)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_bud
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          RUNNER_API_KEY: test-runner-api-key
        run: |
          python -c "
          from app.db.database import engine, Base
          import app.models  # noqa: F401
          import asyncio
          async def run():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
          asyncio.run(run())
          print('Base tables created from models.')
          "

      - name: Alembic upgrade (data migrations + indexes)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_bud
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
        run: |
          pip install alembic
          alembic upgrade head

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_bud
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: test-secret-key-for-ci-at-least-32-characters-long
          RUNNER_API_KEY: test-runner-api-key
          ENABLE_DOCS: "false"
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=60 -v

      - name: Run UI checks
        run: |
          npm --prefix ui run lint
          npx --prefix ui tsc --project ui/tsconfig.json --noEmit
          npm --prefix ui run test -- --coverage

  build-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build Product Image
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected vMAJOR.MINOR.PATCH with optional SemVer prerelease or build metadata." >&2
            exit 1
          fi

          VERSION_WITHOUT_BUILD=${RELEASE_TAG%%+*}
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: bud-sbom.spdx.json
