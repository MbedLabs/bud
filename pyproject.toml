[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bud-app-backend"
version = "1.2.0"
description = "Backend API for Bud Test Management Platform by EmbedLabs"
readme = "README.md"
license = {text = "LicenseRef-EmbedLabs-Source-Available-1.0"}
authors = [
    {name = "EmbedLabs", email = "dev@embedlabs.net"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.2",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pydantic[email]>=2.5.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "PyJWT>=2.15.1",
    "cryptography>=50.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "boto3>=1.34.0",
    "httpx>=0.25.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.19.0",
    "tenacity>=8.0.0",
    "alembic>=1.18.0",
    "reportlab>=4.0.0",
    "Pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "aiosqlite>=0.19.0",
    "moto[s3]>=5.0.0",
    "black>=23.0.0",
    "pymupdf>=1.24.0",
    "mypy>=1.0.0",
]

[dependency-groups]
ci = [
    "black==25.1.0",
    "isort==9.0.2",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]
image = [
    "supervisor==4.3.0",
]
build = [
    "setuptools>=61.0",
    "wheel",
]

[project.urls]
Homepage = "https://www.embedlabs.net"
Repository = "https://github.com/MbedLabs/bud"
License = "https://github.com/MbedLabs/bud/blob/main/LICENSE"
Professional-Services = "https://www.embedlabs.de"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
source = ["app"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
