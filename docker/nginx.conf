server {
    listen 8080;
    server_name _;
    root /var/www/app;
    index index.html;

    # Cap request bodies globally so an unauthenticated flood can't stream
    # gigabytes into the app. The artifact upload route raises its own ceiling
    # below. (nginx's built-in default is only 1m, which silently 413s the
    # operator-configurable artifact uploads this product supports.)
    client_max_body_size 10m;

    # Repeated in every location that sets a header of its own — nginx drops
    # inherited add_header directives there. See the file for the detail.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 25 MiB is the app default. This proxy ceiling permits the documented
    # operator opt-in through the immutable 100 MiB application hard limit.
    # 105m leaves headroom for multipart/form-data boundary overhead so nginx
    # never rejects a request the application itself would accept. This prefix
    # is longer than /api, so nginx routes upload requests here.
    location /api/uploads {
        client_max_body_size 105m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /runtime-config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Brand wordmarks: never cache — logo swaps must show immediately
    location ~* ^/(budnobg|budbg|budicon|bud-mark|bloombg|bloomnobg)\.png$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Other static images / favicons: short cache so updates are not stuck for a year
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
