# All nginx scratch data lives under /run. This works in normal containers and
# on Cloudron, where the image root is read-only and /run is a fresh tmpfs.
client_body_temp_path /run/nginx/body;
proxy_temp_path       /run/nginx/proxy;
fastcgi_temp_path     /run/nginx/fastcgi;
uwsgi_temp_path       /run/nginx/uwsgi;
scgi_temp_path        /run/nginx/scgi;

access_log /dev/stdout;
error_log  /dev/stderr warn;
