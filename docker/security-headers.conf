# Security response headers, in a file because nginx does not inherit them.
#
# `add_header` is inherited from an outer level ONLY when the current level
# declares no `add_header` of its own. Every location below that sets a
# Cache-Control header therefore silently drops the server-level security
# headers - including `location = /index.html`, which is the document the
# Content-Security-Policy exists to protect, and which every SPA deep link
# resolves to through `try_files`.
#
# Verified against nginx 1.24: before this file, `/`, `/index.html`, `/runs`,
# `/runtime-config.js` and `/assets/*` carried none of the four headers, while
# `/api/*` - a location with no `add_header` of its own - carried all four. The
# policy applied to JSON and to nothing else.
#
# So: include this in the server block and again in every location that sets a
# header of its own. tests/test_nginx_security_headers.py fails if a location
# declares `add_header` without including it.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: no inline scripts (Vite emits external bundles only) and no cross-origin
# XHR — the Bud UI only talks to its own /api (Bloom is reached via links, not
# fetch). style-src keeps 'unsafe-inline' for React inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;
