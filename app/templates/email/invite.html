<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        .header { background: #1a73e8; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 30px; }
        .button { display: inline-block; padding: 12px 24px; background: #1a73e8; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .footer { font-size: 0.8em; color: #777; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to ${app_name}</h1>
        </div>
        <div class="content">
            <p>Hello ${full_name},</p>
            <p>You have been invited to join <strong>${app_name}</strong>.</p>
            <p style="text-align: center; margin: 30px 0;">
                <a href="${invite_link}" class="button" style="color: white;">Accept Invitation</a>
            </p>
            <p>Use this link to set your password and activate your account.</p>
            <p>If you did not expect this invitation, you can safely ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 EmbedLabs Team. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
