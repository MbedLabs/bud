<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${app_name}</title>
</head>
<body style="margin:0;padding:0;background:#f4faf4;">
  <!-- Styles are inlined rather than kept in a <style> block: several clients,
       Gmail among them, drop or rewrite head styles on forwarded mail. -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4faf4;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #d9e8d9;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr><td style="background:#29a847;padding:28px 32px;">
          <h1 style="margin:0;font-size:20px;line-height:1.3;font-weight:700;color:#ffffff;">Verify your email</h1>
        </td></tr>
        <tr><td style="height:3px;background:#f3801b;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td style="padding:32px;color:#15281c;font-size:15px;line-height:1.65;">
<p style="margin:0 0 14px;">Hello ${full_name},</p>
            <p style="margin:0 0 14px;">Please verify your email for <strong>${app_name}</strong>.</p>
            <p style="text-align:center;margin:28px 0;">
                <a href="${verification_link}" style="display:inline-block;padding:13px 28px;background:#29a847;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;font-size:15px;">Verify Email</a>
            </p>
            <p style="margin:0 0 14px;">If you did not request this, you can safely ignore this email.</p>
        </td></tr>
        <tr><td style="padding:20px 32px 28px;border-top:1px solid #d9e8d9;color:#607668;font-size:12px;line-height:1.5;">
          <p style="margin:0;">&copy; 2026 EmbedLabs. All rights reserved.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
